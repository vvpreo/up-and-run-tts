<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- up-and-run-tts: робот говорит. ПРОД-исходник, единственный источник правды.
       Варианты для dev/test/uat (цветная рамка) генерируются из него:
       scripts/gen_icons.py и src/icons.py. Руками их не рисовать. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a4f"/>
      <stop offset="1" stop-color="#14101a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- антенна -->
  <rect x="185" y="98" width="18" height="60" rx="9" fill="#e8edf4"/>
  <circle cx="194" cy="92" r="24" fill="#3ecf8e"/>
  <!-- уши -->
  <rect x="50" y="240" width="38" height="80" rx="16" fill="#93a1b3"/>
  <!-- голова -->
  <rect x="66" y="150" width="256" height="250" rx="60" fill="#e8edf4"/>
  <!-- глаза -->
  <circle cx="144" cy="258" r="34" fill="#14101a"/>
  <circle cx="244" cy="258" r="34" fill="#14101a"/>
  <circle cx="152" cy="250" r="12" fill="#ff8c4d"/>
  <circle cx="252" cy="250" r="12" fill="#ff8c4d"/>
  <!-- рот открыт: говорит -->
  <rect x="150" y="318" width="88" height="48" rx="24" fill="#14101a"/>
  <rect x="166" y="330" width="56" height="20" rx="10" fill="#ff8c4d"/>
  <!-- звук, идущий изо рта -->
  <g fill="none" stroke="#ff8c4d" stroke-width="24" stroke-linecap="round">
    <path d="M380 224 a68 68 0 0 1 0 112"/>
    <path d="M406 186 a120 120 0 0 1 0 188" opacity=".55"/>
    <path d="M432 148 a172 172 0 0 1 0 264" opacity=".3"/>
  </g>
</svg>
